services:
  bbb-mp4-panel:
    build: .
    container_name: bbb-mp4-panel
    restart: unless-stopped
    ports:
      - "0.0.0.0:${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - MAX_CONCURRENT=2
      - ALLOWED_ORIGINS=*
      - RESOLUTION=1920x1080
      - VIDEO_BITRATE=2000k
      - AUDIO_BITRATE=128k
      - FFMPEG_PRESET=veryfast
    volumes:
      - bbb-mp4-data:/data
    shm_size: '2gb'
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:${PORT:-3000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

volumes:
  bbb-mp4-data:
